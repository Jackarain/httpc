name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOOST_VERSION: 1.88.0

jobs:
  linux:
    name: linux-${{ matrix.compiler }}${{ matrix.stdlib && format('-{0}', matrix.stdlib) || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
            packages: g++-14
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            packages: g++-13
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
            packages: clang-18
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
            packages: clang-18 libc++-18-dev libc++abi-18-dev
            stdlib: libc++
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev ${{ matrix.packages }}

      - name: Install Boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: ${{ env.BOOST_VERSION }}
          platform_version: 24.04
          toolset: gcc
          arch: x86
          boost_install_dir: ${{ runner.temp }}/boost

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHTTPC_BUILD_EXAMPLES=ON \
            -DHTTPC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macos-${{ matrix.compiler }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            cxx: clang++
          - compiler: gcc
            cxx: g++-14
            packages: gcc@14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install cmake ninja openssl ${{ matrix.packages }}

      - name: Install Boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: ${{ env.BOOST_VERSION }}
          platform_version: 14
          toolset: clang
          arch: aarch64
          boost_install_dir: ${{ runner.temp }}/boost

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHTTPC_BUILD_EXAMPLES=ON \
            -DHTTPC_BUILD_TESTS=ON \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: windows-${{ matrix.compiler }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: msvc
          - compiler: clang-cl
          - compiler: mingw
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW)
        if: matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-boost

      - name: Restore vcpkg cache
        if: matrix.compiler != 'mingw'
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Boost and OpenSSL (vcpkg)
        if: matrix.compiler != 'mingw'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install boost-url boost-system boost-test openssl --triplet x64-windows
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          "BOOST_ROOT=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV

      - name: Configure (MSYS2 / MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHTTPC_BUILD_EXAMPLES=ON \
            -DHTTPC_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

      - name: Configure (MSVC)
        if: matrix.compiler == 'msvc'
        run: |
          cmake -S . -B build -A x64 `
            -DHTTPC_BUILD_EXAMPLES=ON `
            -DHTTPC_BUILD_TESTS=ON

      - name: Configure (clang-cl)
        if: matrix.compiler == 'clang-cl'
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DHTTPC_BUILD_EXAMPLES=ON `
            -DHTTPC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
